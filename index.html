<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jili Super Ace - Online Casino Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .casino-container {
            background: linear-gradient(to bottom, #0f3460 0%, #16213e 50%, #1a0a2e 100%);
            border: 4px solid #ffd700;
            border-radius: 25px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.6), 0 0 120px rgba(255, 100, 0, 0.4), inset 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 40px rgba(255, 100, 0, 0.6);
        }

        .header h1 {
            font-size: 3.5em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .header p {
            font-size: 1.3em;
            color: #ff9500;
            text-shadow: 0 0 10px rgba(255, 149, 0, 0.8);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(15, 52, 96, 0.8);
            border: 3px solid #ffd700;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }

        .stat-box {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 100, 0, 0.1));
            border: 2px solid #ff9500;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 149, 0, 0.3);
        }

        .stat-label {
            font-size: 0.9em;
            color: #ffed4e;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2em;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .multiplier-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.08);
            border: 3px solid #ffd700;
            border-radius: 15px;
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .multiplier-btn {
            padding: 12px;
            background: linear-gradient(135deg, #ff6400, #ff9500);
            border: 3px solid #ffd700;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.5);
        }

        .multiplier-btn:hover {
            box-shadow: 0 0 25px rgba(255, 100, 0, 1);
            transform: scale(1.08);
        }

        .multiplier-btn.active {
            box-shadow: 0 0 30px rgba(255, 215, 0, 1);
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            border-color: #ffff00;
            transform: scale(1.1);
        }

        .slot-grid-wrapper {
            background: linear-gradient(to bottom, #0a1e35, #16213e);
            border: 4px solid #ffd700;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.4);
        }

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .symbol {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1a3a52, #0f2540);
            border: 3px solid #ff9500;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            cursor: default;
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .symbol.spinning {
            animation: spin 0.15s ease-in-out;
        }

        @keyframes spin {
            0%, 100% { transform: rotateY(0deg) rotateX(0deg); }
            50% { transform: rotateY(180deg) rotateX(10deg); }
        }

        .symbol.wild {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 1), inset 0 0 10px rgba(0, 255, 136, 0.4);
            color: #000;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .symbol.scatter {
            background: linear-gradient(135deg, #ffaa00, #ff6400);
            border-color: #ffff00;
            box-shadow: 0 0 20px rgba(255, 170, 0, 1), inset 0 0 10px rgba(255, 255, 0, 0.4);
            color: #fff;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .symbol.winning {
            animation: glow 0.4s ease-in-out !important;
            box-shadow: 0 0 30px rgba(255, 215, 0, 1), inset 0 0 15px rgba(255, 215, 0, 0.6) !important;
            border-color: #ffff00 !important;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.6), inset 0 0 10px rgba(0, 0, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 1), inset 0 0 15px rgba(255, 215, 0, 0.8); }
        }

        .overlay-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: 4px solid #ff6400;
            border-radius: 25px;
            padding: 40px 60px;
            font-size: 3em;
            font-weight: bold;
            color: #000;
            text-shadow: 3px 3px 6px rgba(255, 100, 0, 0.6);
            box-shadow: 0 0 60px rgba(255, 215, 0, 1), 0 0 100px rgba(255, 100, 0, 0.8);
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .button-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 18px 20px;
            font-size: 1.15em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }

        .spin-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: #fff;
            font-size: 1.4em;
            padding: 22px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
            border: 3px solid #ffff00;
        }

        .spin-btn:hover:not(:disabled) {
            box-shadow: 0 0 50px rgba(255, 0, 0, 1);
            transform: scale(1.06);
            cursor: pointer;
        }

        .spin-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .spin-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .turbo-btn {
            background: linear-gradient(135deg, #ff6400, #ff9500);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 100, 0, 0.8);
            border: 3px solid #ffed4e;
        }

        .turbo-btn:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(255, 100, 0, 1);
            transform: scale(1.06);
            cursor: pointer;
        }

        .turbo-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .turbo-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .buy-bonus-btn {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            border: 3px solid #ff6400;
        }

        .buy-bonus-btn:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(255, 215, 0, 1);
            transform: scale(1.06);
            cursor: pointer;
        }

        .buy-bonus-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .buy-bonus-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .info-bar {
            text-align: center;
            color: #ffed4e;
            font-size: 1.1em;
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(15, 52, 96, 0.8), rgba(22, 33, 62, 0.8));
            border: 2px solid #ff9500;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 149, 0, 0.3);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .win-message {
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .firebase-status {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="casino-container">
        <div class="header">
            <h1>🎰 Jili Super Ace 🎰</h1>
            <p>ULTIMATE CASINO EXPERIENCE</p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-label">💰 Balance</div>
                <div class="stat-value" id="balance">1000</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🎲 Bet</div>
                <div class="stat-value" id="bet">30</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🏆 Win</div>
                <div class="stat-value" id="win">0</div>
            </div>
        </div>

        <div class="multiplier-bar">
            <button class="multiplier-btn" data-multiplier="1">×1</button>
            <button class="multiplier-btn" data-multiplier="2">×2</button>
            <button class="multiplier-btn active" data-multiplier="3">×3</button>
            <button class="multiplier-btn" data-multiplier="5">×5</button>
        </div>

        <div class="slot-grid-wrapper">
            <div class="slot-grid" id="slotGrid"></div>
        </div>

        <div class="button-row">
            <button class="action-btn spin-btn" id="spinBtn">🎯 SPIN</button>
            <button class="action-btn turbo-btn" id="turboBtn">⚡ TURBO</button>
            <button class="action-btn buy-bonus-btn" id="buyBonusBtn">💰 BONUS</button>
        </div>

        <div class="info-bar" id="infoBar">👈 Click SPIN to start playing!</div>
    </div>

    <div class="firebase-status" id="firebaseStatus">🔄 Initializing...</div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDndzhlq7tIR03UZroax1iE59RXF27I4Z8",
            authDomain: "jili-c6b1a.firebaseapp.com",
            projectId: "jili-c6b1a",
            storageBucket: "jili-c6b1a.firebasestorage.app",
            messagingSenderId: "665157239109",
            appId: "1:665157239109:web:758500e566830c29b57e2c",
            measurementId: "G-YSZYWY42QB"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // Update Firebase status
        document.getElementById('firebaseStatus').textContent = '✅ Firebase Connected';
        document.getElementById('firebaseStatus').style.color = '#00ff00';

        // Expose logging function globally
        window.logGameEvent = (eventName, eventData = {}) => {
            try {
                logEvent(analytics, eventName, eventData);
                console.log(`📊 Event logged: ${eventName}`, eventData);
            } catch (error) {
                console.error(`❌ Error logging event: ${eventName}`, error);
            }
        };

        // Game State
        const gameState = {
            balance: 1000,
            bet: 10,
            multiplier: 3,
            isSpinning: false,
            currentWin: 0,
            totalSpins: 0,
            totalWins: 0,
            totalLosses: 0,
        };

        // Jili-style symbols with emojis
        const SYMBOLS = {
            'A': 'A',      // Ace
            'K': 'K',      // King
            'Q': 'Q',      // Queen
            'J': 'J',      // Jack
            '7': '7',      // Lucky 7
            '🍒': '🍒',    // Cherry (Red symbol)
            '💎': '💎',    // Diamond
            '🔔': '🔔',    // Bell
        };

        const SYMBOL_ARRAY = Object.values(SYMBOLS);
        const WILD = '⭐';      // Wild - Super Ace
        const SCATTER = '✨';   // Scatter - Magic
        const ROWS = 4;
        const COLS = 5;

        // Initialize grid
        function initGrid() {
            const grid = document.getElementById('slotGrid');
            grid.innerHTML = '';
            for (let i = 0; i < ROWS * COLS; i++) {
                const symbol = document.createElement('div');
                symbol.className = 'symbol';
                symbol.id = `symbol-${i}`;
                grid.appendChild(symbol);
            }
            randomizeSymbols();
        }

        // Randomize symbols on grid
        function randomizeSymbols() {
            const symbols = document.querySelectorAll('.symbol');
            symbols.forEach((sym, idx) => {
                sym.classList.remove('wild', 'scatter', 'winning', 'spinning');
                const rand = Math.random();
                let newSymbol;

                if (rand < 0.08) newSymbol = WILD;
                else if (rand < 0.12) newSymbol = SCATTER;
                else newSymbol = SYMBOL_ARRAY[Math.floor(Math.random() * SYMBOL_ARRAY.length)];

                sym.textContent = newSymbol;
                sym.classList.add(newSymbol === WILD ? 'wild' : newSymbol === SCATTER ? 'scatter' : '');
            });
        }

        // Show overlay message
        function showMessage(text) {
            const msg = document.createElement('div');
            msg.className = 'overlay-message';
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 2500);
        }

        // Check for wins
        function checkWins() {
            const symbols = document.querySelectorAll('.symbol');
            const grid = [];
            symbols.forEach((s, i) => {
                if (!grid[Math.floor(i / COLS)]) grid[Math.floor(i / COLS)] = [];
                grid[Math.floor(i / COLS)][i % COLS] = s;
            });

            let totalWin = 0;
            const winningSymbols = new Set();

            // Check horizontal lines (3, 4, 5 in a row)
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS - 2; col++) {
                    const sym1 = grid[row][col].textContent;
                    const sym2 = grid[row][col + 1].textContent;
                    const sym3 = grid[row][col + 2].textContent;

                    // Check for 3+ match
                    if (sym1 && sym1 === sym2 && sym2 === sym3) {
                        let multiplier = 1;
                        let matchLength = 3;
                        
                        // Check for 4-in-a-row
                        if (col + 3 < COLS && sym3 === grid[row][col + 3].textContent) {
                            multiplier = 2;
                            matchLength = 4;
                        }
                        
                        // Check for 5-in-a-row
                        if (col + 4 < COLS && grid[row][col + 3].textContent === grid[row][col + 4].textContent) {
                            multiplier = 3;
                            matchLength = 5;
                        }

                        if (sym1 === WILD) multiplier *= 2.5;
                        else if (sym1 === SCATTER) multiplier *= 2;

                        const baseWin = gameState.bet * (20 + matchLength * 5);
                        totalWin += baseWin * multiplier;

                        // Mark all matching symbols
                        for (let i = col; i < Math.min(col + matchLength, COLS); i++) {
                            winningSymbols.add(grid[row][i]);
                        }
                    }
                }
            }

            // Highlight winning symbols
            winningSymbols.forEach(sym => {
                sym.classList.add('winning');
            });

            // Count SCATTER for bonus
            let scatterCount = 0;
            symbols.forEach(s => {
                if (s.textContent === SCATTER) scatterCount++;
            });

            if (scatterCount >= 3) {
                totalWin += gameState.bet * 100;
                showMessage(`SCATTER JACKPOT! ✨ +${gameState.bet * 100}`);
                window.logGameEvent('scatter_bonus', {
                    scatter_count: scatterCount,
                    bonus_amount: gameState.bet * 100
                });
            }

            // Count WILD for bonus
            let wildCount = 0;
            symbols.forEach(s => {
                if (s.textContent === WILD) wildCount++;
            });

            if (wildCount >= 3) {
                totalWin += gameState.bet * 150;
                showMessage(`SUPER WILD! ⭐ +${gameState.bet * 150}`);
                window.logGameEvent('wild_bonus', {
                    wild_count: wildCount,
                    bonus_amount: gameState.bet * 150
                });
            }

            gameState.currentWin = Math.floor(totalWin * gameState.multiplier);
            return gameState.currentWin;
        }

        // Enable/Disable buttons based on game state
        function updateButtonStates() {
            const actualBet = gameState.bet * gameState.multiplier;
            const spinBtn = document.getElementById('spinBtn');
            const turboBtn = document.getElementById('turboBtn');
            const bonusBtn = document.getElementById('buyBonusBtn');

            // Only disable spin/turbo if spinning or insufficient balance
            spinBtn.disabled = gameState.isSpinning || gameState.balance < actualBet;
            turboBtn.disabled = gameState.isSpinning || gameState.balance < actualBet;
            
            // Only disable bonus if already spinning or insufficient balance for bonus
            bonusBtn.disabled = gameState.isSpinning || gameState.balance < 100;
        }

        // Perform spin
        async function spin(isTurbo = false) {
            const actualBet = gameState.bet * gameState.multiplier;
            if (gameState.isSpinning || gameState.balance < actualBet) return;

            gameState.isSpinning = true;
            gameState.currentWin = 0;
            gameState.balance -= actualBet;
            gameState.totalSpins++;

            // Disable buttons during spin
            updateButtonStates();

            const symbols = document.querySelectorAll('.symbol');
            symbols.forEach(s => s.classList.remove('winning'));

            // Log spin event
            window.logGameEvent('spin', {
                multiplier: gameState.multiplier,
                bet_amount: actualBet,
                turbo_mode: isTurbo,
                balance_before: gameState.balance + actualBet
            });

            // Spin animation
            const spinTime = isTurbo ? 600 : 1500;
            const spinCount = isTurbo ? 4 : 10;

            for (let i = 0; i < spinCount; i++) {
                symbols.forEach(s => s.classList.add('spinning'));
                randomizeSymbols();
                await new Promise(r => setTimeout(r, spinTime / spinCount));
                symbols.forEach(s => s.classList.remove('spinning'));
            }

            // Final symbols
            randomizeSymbols();
            await new Promise(r => setTimeout(r, 400));

            // Check for wins
            const win = checkWins();

            if (win > 0) {
                gameState.balance += win;
                gameState.totalWins++;
                showMessage(`🎊 BIG WIN! 💰 +${win}`);
                document.getElementById('infoBar').innerHTML = `<span class="win-message">🎉 YOU WON ${win} COINS! 🎉</span>`;

                // Log win event
                window.logGameEvent('spin_win', {
                    win_amount: win,
                    balance_after: gameState.balance,
                    multiplier_used: gameState.multiplier,
                    total_spins: gameState.totalSpins
                });
            } else {
                gameState.totalLosses++;
                showMessage('💫 TRY AGAIN');
                document.getElementById('infoBar').textContent = '❌ No winning combination this time...';

                // Log loss event
                window.logGameEvent('spin_loss', {
                    balance_after: gameState.balance,
                    bet_lost: actualBet,
                    total_spins: gameState.totalSpins
                });
            }

            updateStats();

            // IMPORTANT: Set isSpinning to false FIRST before updating button states
            gameState.isSpinning = false;
            
            // Then re-enable buttons
            updateButtonStates();
        }

        // Update stats display
        function updateStats() {
            document.getElementById('balance').textContent = gameState.balance;
            document.getElementById('bet').textContent = gameState.bet * gameState.multiplier;
            document.getElementById('win').textContent = gameState.currentWin;
        }

        // Event listeners
        document.getElementById('spinBtn').addEventListener('click', () => spin(false));
        document.getElementById('turboBtn').addEventListener('click', () => spin(true));

        document.getElementById('buyBonusBtn').addEventListener('click', () => {
            if (!gameState.isSpinning && gameState.balance >= 100) {
                gameState.balance -= 100;
                gameState.balance += 250;
                showMessage('💥 BONUS ACTIVATED! 💥');
                document.getElementById('infoBar').textContent = '🎁 Bonus Round Activated! Extra rewards ahead!';
                updateStats();
                updateButtonStates();

                // Log bonus purchase event
                window.logGameEvent('bonus_purchase', {
                    cost: 100,
                    reward: 250,
                    balance_after: gameState.balance
                });
            }
        });

        // Multiplier buttons
        document.querySelectorAll('.multiplier-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Don't allow changing multiplier during spin
                if (gameState.isSpinning) return;
                
                const oldMultiplier = gameState.multiplier;
                document.querySelectorAll('.multiplier-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gameState.multiplier = parseInt(e.target.dataset.multiplier);
                updateStats();
                updateButtonStates();

                // Log multiplier change event
                window.logGameEvent('multiplier_change', {
                    from_multiplier: oldMultiplier,
                    to_multiplier: gameState.multiplier,
                    new_bet: gameState.bet * gameState.multiplier
                });
            });
        });

        // Log game session start
        window.logGameEvent('game_session_start', {
            initial_balance: gameState.balance,
            timestamp: new Date().toISOString()
        });

        // Initialize
        initGrid();
        updateStats();
        updateButtonStates();

        // Log session end on page unload
        window.addEventListener('beforeunload', () => {
            window.logGameEvent('game_session_end', {
                final_balance: gameState.balance,
                total_spins: gameState.totalSpins,
                total_wins: gameState.totalWins,
                total_losses: gameState.totalLosses,
                net_change: gameState.balance - 1000,
                timestamp: new Date().toISOString()
            });
        });
    </script>
</body>
</html>
