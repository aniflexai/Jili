<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jili Super Ace - Slot Machine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0d0221 0%, #1a0033 50%, #0d0221 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: linear-gradient(to bottom, #1a0033, #0d0221);
            border: 5px solid #FFD700;
            border-radius: 30px;
            padding: 30px;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.8), inset 0 0 40px rgba(255, 215, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 1);
        }

        .header h1 {
            font-size: 4em;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.5em;
            color: #FF6600;
            text-shadow: 0 0 15px rgba(255, 102, 0, 1);
        }

        .stats-top {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #FF6600;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            color: white;
        }

        .stat-label {
            font-size: 0.85em;
            color: #FFD700;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.8em;
            color: #FFD700;
            font-weight: bold;
            margin-top: 5px;
        }

        .reels-container {
            background: linear-gradient(to bottom, #0a0015, #1a0033);
            border: 4px solid #FFD700;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .reels {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .reel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            perspective: 1000px;
        }

        .reel-symbol {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #2a1a52 0%, #1a0a32 100%);
            border: 3px solid #FF6600;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            transition: all 0.1s;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .reel-symbol.spinning {
            animation: spin-reel 0.1s ease-in-out;
        }

        @keyframes spin-reel {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
        }

        .reel-symbol.wild {
            background: linear-gradient(135deg, #00FF88 0%, #00CC66 100%);
            border-color: #00FF88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 1), inset 0 0 15px rgba(0, 255, 136, 0.4);
            color: black;
        }

        .reel-symbol.scatter {
            background: linear-gradient(135deg, #FFAA00 0%, #FF6600 100%);
            border-color: #FFFF00;
            box-shadow: 0 0 20px rgba(255, 170, 0, 1), inset 0 0 15px rgba(255, 255, 0, 0.3);
        }

        .reel-symbol.winning {
            animation: pulse-glow 0.5s ease-in-out infinite !important;
            box-shadow: 0 0 30px rgba(255, 215, 0, 1), inset 0 0 20px rgba(255, 215, 0, 0.6) !important;
            border-color: #FFFF00 !important;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 1); }
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 18px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #spinBtn {
            grid-column: span 2;
            background: linear-gradient(135deg, #FF0000, #CC0000);
            color: white;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            border: 3px solid #FFFF00;
            font-size: 1.5em;
        }

        #spinBtn:hover:not(:disabled) {
            box-shadow: 0 0 60px rgba(255, 0, 0, 1);
            transform: scale(1.05);
        }

        #spinBtn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #turboBtn {
            background: linear-gradient(135deg, #FF6600, #FFAA00);
            color: white;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.8);
            border: 3px solid #FFFF00;
        }

        #turboBtn:hover:not(:disabled) {
            box-shadow: 0 0 50px rgba(255, 102, 0, 1);
            transform: scale(1.05);
        }

        #turboBtn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #FFD700 0%, #FFED4E 100%);
            border: 4px solid #FF6600;
            border-radius: 30px;
            padding: 50px 80px;
            font-size: 3.5em;
            font-weight: bold;
            color: black;
            text-shadow: 3px 3px 6px rgba(255, 102, 0, 0.8);
            box-shadow: 0 0 80px rgba(255, 215, 0, 1);
            animation: message-pop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes message-pop {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-20deg);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .info-message {
            background: rgba(255, 102, 0, 0.2);
            border: 2px solid #FF6600;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            color: #FFD700;
            font-weight: bold;
            font-size: 1.1em;
        }

        .multiplier-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .mult-btn {
            padding: 10px;
            background: linear-gradient(135deg, #FF6600, #FFAA00);
            border: 2px solid #FFD700;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mult-btn.active {
            background: linear-gradient(135deg, #FFD700, #FFFF00);
            color: black;
            box-shadow: 0 0 30px rgba(255, 215, 0, 1);
            transform: scale(1.1);
        }

        .mult-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎰 JILI SUPER ACE 🎰</h1>
            <p>ULTIMATE SLOT EXPERIENCE</p>
        </div>

        <div class="stats-top">
            <div class="stat">
                <div class="stat-label">Balance</div>
                <div class="stat-value" id="balance">5000</div>
            </div>
            <div class="stat">
                <div class="stat-label">Bet</div>
                <div class="stat-value" id="bet">30</div>
            </div>
            <div class="stat">
                <div class="stat-label">Win</div>
                <div class="stat-value" id="lastWin">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Total Wins</div>
                <div class="stat-value" id="totalWins">0</div>
            </div>
        </div>

        <div class="multiplier-bar" id="multiplierBar"></div>

        <div class="reels-container">
            <div class="reels" id="reels"></div>
        </div>

        <div class="controls">
            <button id="spinBtn">🎯 SPIN</button>
            <button id="turboBtn">⚡ TURBO SPIN</button>
        </div>

        <div class="info-message" id="infoMessage">👈 Click SPIN to play! All reels spin together!</div>
    </div>

    <script type="module">
        // Firebase imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDndzhlq7tIR03UZroax1iE59RXF27I4Z8",
            authDomain: "jili-c6b1a.firebaseapp.com",
            projectId: "jili-c6b1a",
            storageBucket: "jili-c6b1a.firebasestorage.app",
            messagingSenderId: "665157239109",
            appId: "1:665157239109:web:758500e566830c29b57e2c",
            measurementId: "G-YSZYWY42QB"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // Game State
        const gameState = {
            balance: 5000,
            bet: 10,
            multiplier: 3,
            isSpinning: false,
            lastWin: 0,
            totalWins: 0,
        };

        // Symbols - ACE heavy for Jili Super Ace
        const SYMBOLS = ['A', 'A', 'A', 'K', 'Q', 'J', '7'];
        const WILD = '⭐';
        const SCATTER = '✨';
        const REELS = 5;
        const ROWS = 4;

        // Initialize reels
        function initReels() {
            const reelsDiv = document.getElementById('reels');
            reelsDiv.innerHTML = '';

            for (let col = 0; col < REELS; col++) {
                const reel = document.createElement('div');
                reel.className = 'reel';
                reel.id = `reel-${col}`;

                for (let row = 0; row < ROWS; row++) {
                    const symbol = document.createElement('div');
                    symbol.className = 'reel-symbol';
                    symbol.id = `symbol-${col}-${row}`;
                    reel.appendChild(symbol);
                }

                reelsDiv.appendChild(reel);
            }

            randomizeReels();
        }

        // Random symbol
        function getRandomSymbol() {
            const rand = Math.random();
            if (rand < 0.1) return WILD;
            if (rand < 0.15) return SCATTER;
            return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        }

        // Randomize all reels
        function randomizeReels() {
            for (let col = 0; col < REELS; col++) {
                for (let row = 0; row < ROWS; row++) {
                    const symbol = document.getElementById(`symbol-${col}-${row}`);
                    const newSymbol = getRandomSymbol();
                    symbol.textContent = newSymbol;
                    symbol.className = 'reel-symbol';
                    
                    if (newSymbol === WILD) {
                        symbol.classList.add('wild');
                    } else if (newSymbol === SCATTER) {
                        symbol.classList.add('scatter');
                    }
                }
            }
        }

        // Show popup message
        function showMessage(text) {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 2500);
        }

        // Check for wins
        function checkWins() {
            let totalWin = 0;
            const winningSymbols = new Set();

            // Check each row
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < REELS - 2; col++) {
                    const sym1 = document.getElementById(`symbol-${col}-${row}`).textContent;
                    const sym2 = document.getElementById(`symbol-${col + 1}-${row}`).textContent;
                    const sym3 = document.getElementById(`symbol-${col + 2}-${row}`).textContent;

                    if (sym1 && sym1 === sym2 && sym2 === sym3) {
                        let matchLength = 3;
                        let multiplier = 1;

                        // Check 4 in a row
                        if (col + 3 < REELS && sym3 === document.getElementById(`symbol-${col + 3}-${row}`).textContent) {
                            matchLength = 4;
                            multiplier = 2;
                        }

                        // Check 5 in a row
                        if (col + 4 < REELS && document.getElementById(`symbol-${col + 3}-${row}`).textContent === document.getElementById(`symbol-${col + 4}-${row}`).textContent) {
                            matchLength = 5;
                            multiplier = 3;
                        }

                        // Bonus for ACE
                        if (sym1 === 'A') multiplier *= 2.5;
                        if (sym1 === WILD) multiplier *= 2.5;
                        if (sym1 === SCATTER) multiplier *= 2;

                        const baseWin = gameState.bet * (25 + matchLength * 10);
                        totalWin += baseWin * multiplier * gameState.multiplier;

                        // Mark winning symbols
                        for (let i = col; i < col + matchLength; i++) {
                            winningSymbols.add(`symbol-${i}-${row}`);
                        }
                    }
                }
            }

            // Highlight winners
            winningSymbols.forEach(id => {
                document.getElementById(id).classList.add('winning');
            });

            // Bonus messages
            let scatterCount = 0;
            let wildCount = 0;
            let aceCount = 0;

            for (let col = 0; col < REELS; col++) {
                for (let row = 0; row < ROWS; row++) {
                    const sym = document.getElementById(`symbol-${col}-${row}`).textContent;
                    if (sym === SCATTER) scatterCount++;
                    if (sym === WILD) wildCount++;
                    if (sym === 'A') aceCount++;
                }
            }

            if (scatterCount >= 3) {
                const bonus = gameState.bet * 100;
                totalWin += bonus;
                showMessage(`💥 SCATTER BONUS! +${bonus}`);
            }

            if (wildCount >= 3) {
                const bonus = gameState.bet * 150;
                totalWin += bonus;
                showMessage(`🌟 WILD BONUS! +${bonus}`);
            }

            if (aceCount >= 5) {
                const bonus = gameState.bet * 200;
                totalWin += bonus;
                showMessage(`🎰 SUPER ACE! +${bonus}`);
            }

            return totalWin;
        }

        // Spin function
        async function spin(isTurbo = false) {
            if (gameState.isSpinning) return;

            const actualBet = gameState.bet * gameState.multiplier;
            if (gameState.balance < actualBet) {
                showMessage('❌ INSUFFICIENT BALANCE');
                return;
            }

            gameState.isSpinning = true;
            gameState.balance -= actualBet;
            updateUI();

            // Disable buttons
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('turboBtn').disabled = true;

            // Spin time
            const duration = isTurbo ? 600 : 1500;
            const iterations = isTurbo ? 4 : 12;
            const perIteration = duration / iterations;

            // Spin animation
            for (let i = 0; i < iterations; i++) {
                // Add spinning animation to all symbols
                const allSymbols = document.querySelectorAll('.reel-symbol');
                allSymbols.forEach(s => s.classList.add('spinning'));

                randomizeReels();
                await new Promise(r => setTimeout(r, perIteration));

                allSymbols.forEach(s => s.classList.remove('spinning'));
            }

            // Final result
            randomizeReels();
            await new Promise(r => setTimeout(r, 300));

            // Check wins
            const win = checkWins();

            if (win > 0) {
                gameState.balance += win;
                gameState.lastWin = win;
                gameState.totalWins++;
                showMessage(`🎊 WIN! +${win} COINS! 🎊`);
                
                logEvent(analytics, 'spin_win', {
                    win_amount: win,
                    balance: gameState.balance,
                    multiplier: gameState.multiplier
                });
            } else {
                gameState.lastWin = 0;
                showMessage('Try Again!');
                
                logEvent(analytics, 'spin_loss', {
                    balance: gameState.balance
                });
            }

            updateUI();

            gameState.isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
            document.getElementById('turboBtn').disabled = false;

            logEvent(analytics, 'spin', {
                turbo: isTurbo,
                multiplier: gameState.multiplier,
                balance: gameState.balance
            });
        }

        // Update UI
        function updateUI() {
            document.getElementById('balance').textContent = gameState.balance;
            document.getElementById('bet').textContent = gameState.bet * gameState.multiplier;
            document.getElementById('lastWin').textContent = gameState.lastWin;
            document.getElementById('totalWins').textContent = gameState.totalWins;
        }

        // Event listeners
        document.getElementById('spinBtn').addEventListener('click', () => spin(false));
        document.getElementById('turboBtn').addEventListener('click', () => spin(true));

        // Initialize
        initReels();
        updateUI();

        // Log session
        logEvent(analytics, 'game_start', {
            starting_balance: gameState.balance
        });

        window.addEventListener('beforeunload', () => {
            logEvent(analytics, 'game_end', {
                final_balance: gameState.balance,
                total_wins: gameState.totalWins
            });
        });
    </script>
</body>
</html>
